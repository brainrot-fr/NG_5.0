<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to TKREC</title>
</head>
<body>
    <form id="staffLoginForm">
      <h2 align="center">Staff Login</h2>
      <table align="center">
        <tr>
          <td><input type="text" placeholder="Username" required /></td>
        </tr>
        <tr>
          <td><input type="password" placeholder="Password" required /></td>
        </tr>
        <tr>
          <td>
            <input
              type="submit"
              value="Login"
              style="display: block; margin-left: auto; margin-right: auto"
            />
          </td>
        </tr>
      </table>
    </form>

    <form id="studentLoginForm">
      <h2 align="center">Student Login</h2>
      <table align="center">
        <tr>
          <td><input type="text" placeholder="Username" required /></td>
        </tr>
        <tr>
          <td><input type="password" placeholder="Password" required /></td>
        </tr>
        <tr>
          <td>
            <input
              type="submit"
              value="Login"
              style="display: block; margin-left: auto; margin-right: auto"
            />
          </td>
        </tr>
      </table>
    </form>
</body>
</html>
