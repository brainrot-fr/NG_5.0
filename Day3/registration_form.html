<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    
  </head>
  <body style="background-color: aqua">
    <form>
      <h1 align="center">Registration Form</h1>
      <table align="center" border="0">
        <tr>
          <td>Roll no. :</td>
          <td>
            <input type="text" name="" id="" required />
          </td>
        </tr>
        <tr>
          <td>Student name :</td>
          <td>
            <input
              type="text"
              name=""
              id=""
              placeholder="First Name"
              required
            />
            -
            <input type="text" placeholder="Last Name" required />
          </td>
        </tr>
        <tr>
          <td>Fathers name:</td>
          <td><input type="text" required /></td>
        </tr>
        <tr>
          <td>Date of Birth :</td>
          <td>
            <input type="number" name="" id="" placeholder="Day" required />-
            <input type="number" placeholder="Month" required />
            -
            <input type="number" placeholder="Year" required />
            (DD-MM-YYYY)
          </td>
        </tr>
        <tr>
          <td>Mobile no. :</td>
          <td>
            <input type="text" required />
            <select>
              <option selected>+91</option></select
            >-<input type="tel" required />
          </td>
        </tr>
        <tr>
          <td>Email :</td>
          <td><input type="text" required /></td>
        </tr>
        <tr>
          <td>Password :</td>
          <td><input type="password" required /></td>
        </tr>
        <tr>
          <td>Gender :</td>
          <td><input type="radio" />Male <input type="radio" />Female</td>
        </tr>
        <tr>
          <td>Department :</td>
          <td>
            <input type="checkbox" />CSE <br />
            <input type="checkbox" />IT <br />
            <input type="checkbox" />ECE <br />
            <input type="checkbox" />Civil <br />
            <input type="checkbox" />Mech
          </td>
        </tr>
        <tr>
          <td>Course :</td>
          <td>
            <select name="" id="">
              <option value="" selected>Select Course</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>Student photo :</td>
          <td><input type="file" /></td>
        </tr>
        <tr>
          <td>City :</td>
          <td><input type="text" /></td>
        </tr>
        <tr>
          <td>Address :</td>
          <td><textarea name="" id=""></textarea></td>
        </tr>
        <tr>
          <td colspan="7" align="center"><input type="submit" /></td>
        </tr>
      </table>
    </form>
  </body>
</html>
