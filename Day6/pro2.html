<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript</title>
  </head>
  <body>
    <h1>JavaScript nerchuko ra faltu console open chey</h1>
    Enter First Number:
    <input type="text" id="fnum" /><br />
    Enter Second Number:
    <input type="text" id="snum" /><br />
    <button onclick="add()">Add</button>
    <button onclick="sub()">Sub</button>
    <button onclick="mul()">Multiply</button>
    <button onclick="div()">Division</button>
    <p id="div"></p>
    <script>
      function add() {
        let a = Number(document.getElementById("fnum").value);
        let b = Number(document.getElementById("snum").value);
        let addTwoNumbers = a + b;
        document.getElementById("div").innerHTML =
          "Addition of Two numbers: " + addTwoNumbers;
      }
      function sub() {
        let a = Number(document.getElementById("fnum").value);
        let b = Number(document.getElementById("snum").value);
        let subTwoNumbers = a - b;
        document.getElementById("div").innerHTML =
          "Subtraction of Two numbers: " + subTwoNumbers;
      }
      function mul() {
        let a = Number(document.getElementById("fnum").value);
        let b = Number(document.getElementById("snum").value);
        let mulTwoNumbers = a * b;
        document.getElementById("div").innerHTML =
          "Multiplication of Two numbers: " + mulTwoNumbers;
      }
      function div() {
        let a = Number(document.getElementById("fnum").value);
        let b = Number(document.getElementById("snum").value);
        let divTwoNumbers = a / b;
        document.getElementById("div").innerHTML =
          "Division of Two numbers: " + divTwoNumbers;
      }
    </script>
  </body>
</html>
